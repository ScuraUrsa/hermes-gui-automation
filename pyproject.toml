[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-gui"
version = "0.1.0"
description = "GUI automation library for Hermes agents (AT-SPI2, OCR, VLM and browser backends)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mss>=9.0.0",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "opencv-python>=4.9.0",
]

[project.optional-dependencies]
# Mirrors tests/requirements-test.txt
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.2.0",
    "pytest-xdist>=3.5.0",
    "mss>=9.0.0",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "opencv-python>=4.9.0",
]

# Optional VLM backend (Florence-2). Its remote code (trust_remote_code) breaks
# on transformers >= 4.50; einops and timm are imported by that remote code.
vlm = [
    "torch",
    "transformers>=4.38,<4.50",
    "einops",
    "timm",
]

[tool.setuptools.packages.find]
include = ["hermes_gui*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers --strict-config"
timeout = 300
markers = [
    "smoke: Critical path tests (fast, no external deps)",
    "unit: Unit tests for individual modules",
    "integration: Tests requiring real display and tools",
    "slow: Tests taking >10 seconds",
    "vlm: Tests requiring VLM models (Florence-2, OmniParser)",
    "browser: Tests requiring Playwright browsers",
    "app: Tests requiring real GUI applications",
    "xvfb: Tests requiring Xvfb display server",
]

[tool.ruff.lint.per-file-ignores]
# pyatspi surfaces AT-SPI/D-Bus failures as many unrelated exception types
# (GLib.GError, RuntimeError, NotImplementedError, ...). Each strategy here is
# best-effort and must fall through to the next one, so broad excepts are
# intentional.
"hermes_gui/backends/atspi.py" = ["BLE001", "S110", "S112"]
